services:
  postgres:
    image: postgres:latest
    container_name: wireguard_bot_postgres
    env_file: .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
        postgres
        -c log_min_messages=warning
        -c log_checkpoints=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wgnet


  bot:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: mybot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wgnet

networks:
  wgnet:

volumes:
  postgres_data:
